name: Flemme mobile
on:
  push:
    branches: [feature/flemme-mobile]
    paths: ['apps/mobile/**', '.github/workflows/flemme-mobile-ci.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/flemme-mobile-ci.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:android
        env:
          EXPO_OFFLINE: '1'
      - run: npm run export:ios
        env:
          EXPO_OFFLINE: '1'
      - run: npm ci --ignore-scripts && npm test
        working-directory: apps/mobile/backend
