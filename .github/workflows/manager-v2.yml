name: Manager V2 tests
on:
  pull_request:
    paths: ['flemme-managerV1/**', 'flemme-web-beta/**', 'supabase/manager-memory-v2-20261014.sql', '.github/workflows/manager-v2.yml']
  push:
    branches: ['feature/manager-v2-supabase-20261014', 'feature/manager-v2-activation-20261014']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flemme-managerV1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
        env:
          PYTHON_DOTENV_DISABLED: '1'
          OPENAI_API_KEY: ''
          OPENAI_AGENTS_DISABLE_TRACING: '1'
      - run: uv run --locked python -m compileall -q src
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: manager_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: flemme-managerV1/tests/sql
      - run: npm test
        working-directory: flemme-managerV1/tests/sql
        env:
          SQL_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@localhost:5432/manager_v2_test

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test flemme-web-beta/tests/*.test.mjs
      - run: node --check flemme-web-beta/manager-v2.js
      - run: node build.js
        working-directory: flemme-web-beta
