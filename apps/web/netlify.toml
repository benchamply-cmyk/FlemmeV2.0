# Site Netlify de test pour apps/web, séparé de flemme.org.
# Dans Netlify : nouveau projet depuis ce dépôt, branche beta, « Base directory » = apps/web.
# Netlify lit alors ce fichier-ci et non le netlify.toml racine (qui publie flemme-web-beta).
[build]
  command = "npm run build"
  publish = "dist"
  # Ne reconstruit que si apps/web ou les règles partagées de apps/mobile/src ont changé.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../mobile/src"

[build.environment]
  NODE_VERSION = "22"

# Site de test : jamais indexé par les moteurs de recherche.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
