# Netlify publie le site bêta (dossier flemme-web-beta) depuis ce dépôt.
# « base » : dossier du site ; « publish » et « command » sont relatifs à ce dossier.
# Même contenu que flemme-web-beta/netlify.toml, pour que la configuration
# fonctionne que Netlify lise ce fichier-ci ou celui du dossier.
[build]
  base = "flemme-web-beta"
  command = "node build.js"
  publish = "."

# Fonctions (netlify/functions) : esbuild les regroupe avec leurs dépendances
# (package.json) et le fichier content/categories.json qu'utilise l'assistant.
[functions]
  node_bundler = "esbuild"

# Le code des fonctions (netlify/functions) n'est pas à servir comme une page.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Les dépendances des fonctions ne sont pas à servir comme des pages.
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
