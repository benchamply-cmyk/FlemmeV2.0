backend:
  name: github
  repo: benchamply-cmyk/FlemmeV2.0
  branch: main
locale: fr
media_folder: flemme-web-beta/uploads
public_folder: /uploads
publish_mode: simple
collections:
  - name: contenu
    label: Contenu du site
    files:
      - name: accueil
        label: Accueil (textes)
        file: flemme-web-beta/content/accueil.json
        format: json
        fields:
          - { label: Phrase sous le titre, name: accroche, widget: string }
          - label: Textes grisés du champ de saisie (ils défilent toutes les 3 s)
            name: placeholders
            widget: list
            field: { label: Texte, name: texte, widget: string }
      - name: categories
        label: Ce qu'on peut faire pour toi (résultats)
        file: flemme-web-beta/content/categories.json
        format: json
        fields:
          - label: Groupes
            name: groupes
            widget: list
            summary: "{{fields.emoji}} {{fields.nom}}"
            fields:
              - { label: Identifiant (sans espace ni accent), name: id, widget: string }
              - { label: Emoji, name: emoji, widget: string }
              - { label: Titre, name: nom, widget: string, hint: "Ex : On te trouve quelqu’un pour faire le boulot" }
              - { label: Accroche, name: accroche, widget: string }
              - { label: Résultat livré, name: resultat, widget: text }
              - label: Résultats proposés
                name: sous
                widget: list
                summary: "{{fields.emoji}} {{fields.nom}}"
                fields:
                  - { label: Identifiant, name: id, widget: string, hint: "Unique, sans espace ni accent. Ne pas modifier pour une catégorie existante." }
                  - { label: Emoji, name: emoji, widget: string }
                  - { label: Intitulé, name: nom, widget: string, hint: "Ex : On te trouve un artisan" }
                  - { label: Phrase préremplie au clic, name: exemple, widget: string }
                  - { label: Importance (1 à 5), name: etoiles, widget: number, value_type: int, min: 1, max: 5 }
                  - label: Qui s'en occupe
                    name: type
                    widget: select
                    options:
                      - { label: Agent IA, value: ia }
                      - { label: IA + assistant humain, value: h }
                      - { label: IA + Flemmeur sur place, value: f }
                  - label: Mots-clés pour reconnaître une demande
                    name: mots_cles
                    widget: list
                    required: false
                    field: { label: Mot-clé, name: mot, widget: string }
      - name: contact
        label: Coordonnées de contact
        file: flemme-web-beta/content/contact.json
        format: json
        fields:
          - { label: E-mail, name: email, widget: string }
          - { label: Téléphone, name: telephone, widget: string }
