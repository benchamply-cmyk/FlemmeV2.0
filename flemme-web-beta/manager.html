<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mes conversations — Flemme</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="espace.css"><link rel="stylesheet" href="manager-v2.css"></head>
<body><header><a class="logo" href="./">FLEMME<span>.</span></a><a href="espace.html">Mon espace</a></header>
<main class="espace manager-memory"><h1>Mes conversations</h1><p>Retrouve tes échanges et suis tes missions.</p>
<p id="managerNotice" role="status" aria-live="polite"></p><a id="managerLogin" href="espace.html" hidden>Me connecter</a>
<section id="managerPanel" hidden><div class="manager-toolbar"><button id="newConversation" type="button">Nouvelle conversation</button><button id="refreshConversation" type="button">Actualiser</button></div>
<label for="conversationList">Reprendre une conversation</label><select id="conversationList"><option value="">Choisis une conversation</option></select><button id="olderConversations" type="button" hidden>Charger les conversations plus anciennes</button>
<section id="conversationPanel" hidden><h2 id="missionState"></h2><div id="conversationMessages" aria-live="polite"></div>
<form id="managerMessage"><label for="messageText">Ton besoin ou tes précisions</label><textarea id="messageText" rows="5" maxlength="5000" required></textarea><button type="submit" id="sendMessage">Envoyer</button></form>
<details><summary>Historique de la mission</summary><ol id="missionEvents"></ol></details>
<form id="missionUpdate"><label for="eventKind">Ajouter à l’historique</label><select id="eventKind"><option value="action">Action effectuée</option><option value="result">Résultat obtenu</option><option value="status">Changer le statut</option></select><label for="eventState">Nouveau statut, pour un changement de statut</label><select id="eventState"><option value="in_progress">En cours</option><option value="blocked">Bloquée</option><option value="completed">Terminée</option><option value="cancelled">Annulée</option></select><label for="eventNote">Note</label><input id="eventNote" maxlength="300" required><label for="eventResult">Résultat, si tu en ajoutes un</label><textarea id="eventResult" maxlength="5000" rows="3"></textarea><button type="submit">Enregistrer</button></form>
<button type="button" id="recoverMessage" hidden>Libérer l’analyse interrompue</button>
<p class="hint">Les actions et résultats ajoutés ici sont tes déclarations. Annuler une mission conserve son historique.</p></section></section></main>
<script src="content.js" defer></script><script src="sb.js" defer></script><script src="manager-v2-api.js" defer></script><script src="manager-v2.js" defer></script></body></html>
